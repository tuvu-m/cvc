<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e2503c">
<title>Cá Viên Chiên Bé Ba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e2503c;--red-d:#b8361e;--mus:#f6c24a;--teal:#2f8f8a;--teal-d:#1f6b67;--cream:#fdf3df;--paper:#fffaf0;--ink:#1f2d4d;--muted:#7d7466;--line:#d8c9b0;--good:#3f8f66;--bad:#d9534f;--f-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-b:"Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#2a3558;color:var(--ink);font-family:var(--f-b);overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hud{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px);padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--red);color:#fff;border-bottom:3px solid var(--ink)}
.hud b{font-family:var(--f-d);font-size:20px;line-height:1}.hud .sp{flex:1}
.pill{font-family:var(--f-d);font-weight:800;font-size:15px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}.scr[hidden]{display:none}
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
.foot{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--red);color:#fff;font-family:var(--f-d);font-weight:800;font-size:17px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.btn.wide{flex:1}.btn.ghost{background:var(--paper);color:var(--ink)}.btn.teal{background:var(--teal)}.btn[disabled]{opacity:.45}
.btn.sm{min-height:34px;font-size:14px;padding:0 10px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
h2{font-family:var(--f-d);font-size:22px;margin:2px 2px 10px;line-height:1.1}
/* thẻ lộ trình */
.rcard{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 10px 10px;margin-bottom:12px;box-shadow:0 4px 0 var(--ink)}
.rcard .rh{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-weight:800;font-size:18px;margin:0 2px 4px}.rcard .rh span{flex:1}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:2px 8px;align-items:center;padding:6px 4px;border-top:2px dashed var(--line)}
.stop .tm{font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1}.stop .tm i{display:block;font-style:normal;font-size:20px}
.stop .ln{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;min-width:0}.stop .ln small{font-size:12px;color:var(--red)}
.stop .ln .ev{font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:999px;padding:0 6px}
.stop .lk{grid-column:2;display:flex;align-items:center;gap:3px;min-width:0}.stop .lk img{width:22px;height:22px;object-fit:contain}.stop .lk .hd{width:20px;height:26px;object-fit:cover;object-position:top;border-radius:6px;background:#efe3cc}
.crowd{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.crowd .bars{display:flex;gap:2px;align-items:flex-end;height:22px}.crowd .bars i{display:block;width:6px;border-radius:2px;background:var(--line)}.crowd .bars i.on{background:var(--red)}
/* chợ */
.mtop{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.warn{border-color:var(--red);color:var(--red)}
.mrow{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px}
.mrow.on{border-color:var(--teal);background:#eaf6f2}.mrow .gi{font-size:30px;text-align:center;line-height:46px}.mrow img{width:46px;height:46px;object-fit:contain}
.mrow .nm{font-weight:800;font-size:15px;line-height:1.15}.mrow .pr{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--red)}.dn{color:var(--good)}.tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);border-radius:999px;padding:0 6px;vertical-align:2px}
.step{display:flex;align-items:center;gap:4px}.step button{width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:20px;line-height:1}
.step b{min-width:22px;text-align:center;font-family:var(--f-d);font-size:19px}
.tog{width:46px;height:42px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:18px}.tog.on{background:var(--teal);color:#fff}
.sec{font-family:var(--f-d);font-weight:800;font-size:16px;margin:12px 2px 6px;color:var(--muted)}
/* bán */
#sell{position:relative}
.sceneWrap{flex:none;position:relative}.sceneWrap canvas{display:block;touch-action:none}
.xord{flex:none;padding:5px 8px 4px;background:var(--paper);border-top:3px solid var(--ink);border-bottom:2px solid var(--line);height:82px;overflow:hidden}
.xh{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.2}.xh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.xh small{font-size:11px;font-weight:700;color:var(--muted);flex:none}
.xp{flex:1;min-width:40px;height:7px;border-radius:99px;background:#eadfd3;overflow:hidden;display:block}.xp>i{display:block;height:100%;width:100%;background:var(--good)}
.xcs{display:flex;flex-wrap:nowrap;gap:4px;margin-top:4px;overflow:hidden}.xc{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;padding:1px 8px 1px 3px;border-radius:999px;border:2px solid #ee7a1f;background:#ffe8d2;line-height:1.35;white-space:nowrap}
.xc img{width:18px;height:18px;object-fit:contain}.xc b{font-variant-numeric:tabular-nums}.xc.s{padding-left:7px}.xc.ok{border-color:#9fd4b8;background:#eef8f2;color:#2f6a4c}.xc.wip{border-color:#e0b24a;background:#fff6dc}.xc.bad{border-color:var(--bad);background:#fde3e0;color:var(--bad)}
.xn{font-size:22px;padding:8px 2px;text-align:center}
.xq{display:flex;gap:4px;margin-top:4px;overflow:hidden}.qn{display:inline-flex;align-items:center;gap:1px;font-size:12px;font-weight:800;color:var(--muted);background:#f1e8da;border-radius:8px;padding:1px 5px}.qn img{width:15px;height:15px;object-fit:contain;margin-left:2px}.qn i{font-style:normal;font-size:10px}
.goal{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px;margin:0 0 10px;box-shadow:0 3px 0 var(--ink)}.goal.done{border-color:var(--good)}
.goal img{width:58px;height:50px;object-fit:contain}.goal .gm{flex:1;min-width:0}.goal b{font-family:var(--f-d);font-size:17px;display:block}.goal small{font-size:12px;font-weight:700;color:var(--muted)}
.gbar{height:8px;border-radius:99px;background:#eadfd3;overflow:hidden;margin-top:4px}.gbar i{display:block;height:100%;background:var(--mus)}
.pcWrap{position:relative;overflow:hidden;background:#f1d9ad;height:min(62vh,470px);border-radius:12px;border:2px solid var(--line);margin:8px 0}
.card.ed{max-width:420px;padding:10px 12px 12px;text-align:left}.edh{display:flex;align-items:center;gap:6px;font-size:15px;min-height:30px}.edh #edHead{flex:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.edh .x{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);font-weight:800}
.acts.row2{flex-direction:row}
.mrow.menu{grid-template-columns:28px 1fr auto;cursor:pointer}.mrow .qimg{width:20px;height:60px;object-fit:contain}.mrow .ed{font-size:18px}
.faces img,.chip img{width:20px;height:24px;object-fit:cover;object-position:top;border-radius:5px;vertical-align:middle}.chip img:not(.hd){object-fit:contain}
h2 .cnt{font-size:15px;color:var(--muted)}
.addm{width:100%;min-height:52px;border:3px dashed var(--line);border-radius:14px;font-family:var(--f-d);font-size:20px;font-weight:800;color:var(--muted);background:transparent}
.tag.m{background:var(--red)}
.xc img.qi,.qn img.qi{width:8px;height:24px;object-fit:contain}.pcWrap canvas{display:block;touch-action:none}
.foot .chip{align-self:center}
.xeWrap{flex:1;min-height:0;position:relative;overflow:hidden;background:#f4e6cc}.xeWrap canvas{display:block;touch-action:none}
.pauseBtn{position:absolute;right:8px;top:calc(6px + env(safe-area-inset-top,0px));z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(255,250,240,.92);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:4px}
.pauseBtn i{display:block;width:4px;height:13px;border-radius:2px;background:var(--ink)}
.ov{position:absolute;inset:0;z-index:20;background:rgba(31,45,77,.55);display:flex;align-items:center;justify-content:center;padding:20px}.ov[hidden]{display:none}
.card{width:100%;max-width:340px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--ink);text-align:center}
.card .big{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.15;margin:2px 0 8px}
.card .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:16px;margin:6px 0 12px}
.card .acts{display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:50%;bottom:calc(var(--tb,40%) - 40px);transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:6px 14px;border-radius:14px;font-weight:700;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:.95;transform:translate(-50%,0)}.toast.tip{white-space:normal;width:max-content;max-width:min(320px,calc(100% - 24px));text-align:center;line-height:1.3}.tp{cursor:pointer;padding:4px 2px;margin:-4px -2px}
#app.selling .toast{bottom:auto;top:calc(var(--sh,180px) - 34px)}
#app:not(.selling) .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* tổng kết */
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sbox{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px}.sbox small{display:block;font-size:12px;font-weight:700;color:var(--muted)}.sbox b{font-family:var(--f-d);font-size:22px;font-variant-numeric:tabular-nums}
.sbox.net{grid-column:1/3;border-color:var(--ink);border-width:3px}.sbox.net b{font-size:28px}
.mlist{display:flex;flex-wrap:wrap;gap:6px}.mlist span{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px}.mlist img{width:22px;height:22px;object-fit:contain}
/* hub */
.hubbar{display:flex;gap:6px;margin:0 0 10px}.hb{flex:1;min-height:52px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--ink);line-height:1.05}.hb i{font-style:normal;font-size:20px}.hb small{font-size:12px;font-weight:800;color:var(--muted)}
.hb:active{transform:translateY(2px);box-shadow:none}
.hubhead{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--paper);border-bottom:2px solid var(--line)}
.hubhead .back{width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);font-weight:800;font-size:20px;background:#fff}
#hubTabs{flex:1;display:flex;gap:5px}.ht{flex:1;height:44px;border-radius:12px;border:2px solid var(--line);font-size:20px;background:#fff}.ht.on{border-color:var(--ink);background:var(--mus)}
.srow{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px}
.srow>img:first-child{width:40px;height:52px;object-fit:cover;object-position:top;border-radius:8px;background:#efe3cc;flex:none}.srow .qimg{width:20px;height:60px;object-fit:contain}
.sm{flex:1;min-width:0}.sm b{font-size:15px;display:block;line-height:1.15}.sm small{font-size:12px;font-weight:700;color:var(--muted)}
.st{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;font-weight:700;color:#c0702a}
.empty{color:var(--muted);text-align:center;font-weight:800;font-size:18px;padding:18px 0}
.rvbars{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:8px}.rvbars div{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}.rvbars span{width:22px}.rvbars i{display:block;height:7px;border-radius:9px;background:var(--mus);min-width:2px}.rvbars b{color:var(--muted)}
.filt{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto}.filt button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13px}.filt button.on{border-color:var(--ink);background:var(--mus)}
.rv{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;text-align:left}.rv.bad{border-color:#f0b0a8;background:#fff5f2}
.rvh{display:flex;align-items:center;gap:6px;font-size:13.5px}.rvh img{width:26px;height:32px;object-fit:cover;object-position:top;border-radius:6px;background:#efe3cc;flex:none}.rvh b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rvh .s{color:#e0962a;font-size:13px;white-space:nowrap}.rvh small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.rv p{margin:4px 0 2px;font-size:13.5px;line-height:1.35}
.def{display:flex;gap:6px;margin-top:6px;padding:6px 8px;border-radius:10px;font-size:13px;line-height:1.35;text-align:left}.def img{width:24px;height:30px;object-fit:cover;object-position:top;border-radius:6px;flex:none}.def.win{background:#eef8f2;border:2px solid #9fd4b8}.def.lose{background:#f6ece6;border:2px solid var(--line)}.def i{color:var(--muted)}
.rep{margin-top:6px;font-size:13px;background:#fff6dc;border-radius:10px;padding:5px 8px}.rback{display:flex;gap:6px;align-items:center;margin:4px 0 0 18px;font-size:13px;line-height:1.3}.rback img{width:22px;height:26px;object-fit:cover;object-position:top;border-radius:6px;flex:none}.rback span{background:#f1f1ee;border-radius:10px;padding:4px 8px}
.ra{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}.ra .btn.sm{min-width:44px;min-height:38px;font-size:16px}
.regs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.regb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 2px 0 var(--ink)}.regb img{width:36px;height:46px;object-fit:cover;object-position:top;border-radius:8px}.regb b{font-size:13px}.regb small{font-size:11px;color:var(--muted);font-weight:700}
.cset{background:var(--paper);border:2px solid var(--line);border-radius:14px;margin-bottom:6px;overflow:hidden}.cset.full{border-color:#e0b24a;background:#fff8e2}
.csh{width:100%;display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;gap:0 8px;align-items:center;padding:8px 10px;text-align:left;min-height:52px}.csh i{grid-row:1/3;font-style:normal;font-size:24px;text-align:center}.csh .cupi{grid-row:1/3;width:32px;height:40px;object-fit:contain}.csh b{font-size:15px}.csh small{font-weight:800;color:var(--muted)}.csh .gbar{grid-column:2/4;margin-top:3px}
.cl{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 10px}.cl span{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;background:#f1e8da;color:var(--muted);border-radius:999px;padding:2px 9px}.cl span.ok{background:#e4f4ea;color:#2f6a4c}.cl img{width:18px;height:22px;object-fit:contain}
.own{color:var(--good);font-size:22px;padding:0 8px}.li{font-size:30px;text-align:center}
.rvsum{display:flex;align-items:center;gap:6px;width:100%;min-height:48px;padding:0 14px;margin-bottom:10px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--ink)}.rvsum b{color:var(--red)}.rvsum span{margin-left:auto;font-size:22px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.pk{display:flex;flex-direction:column;align-items:center;padding:8px 4px;min-height:70px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 2px 0 var(--ink)}.pk span{font-size:24px}.pk b{font-size:13px}.pk small{font-size:11px;color:var(--muted);font-weight:800}
.sws{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;flex:none;max-width:45%}.sw{font-size:11px;font-weight:800;border-radius:8px;padding:0 6px;background:#f1e8da;color:var(--muted)}.sw.prep,.sw.fry{background:#e4f4ea;color:#2f6a4c}
.qn.reg{background:#fff1c4;color:#9a6a10}.qn.sw{background:#e4f4ea;color:#2f6b4c}.rg{color:#c0702a}
.mrow.rec{border-color:#e0b24a;background:#fff8e2}
.evBtn{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;min-height:48px;font-size:18px;animation:evp .5s infinite alternate}@keyframes evp{to{transform:translateX(-50%) scale(1.08)}}
#fightCard,#pickCard{max-height:calc(100% - 20px);overflow-y:auto}
.hud .pill{cursor:pointer}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px}.rsb{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;align-items:center;gap:0 6px;min-height:50px;padding:4px 8px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left}.rsb img{grid-row:1/3;width:34px;height:34px;object-fit:contain}.rsb b{font-size:16px;font-family:var(--f-d)}.rsb small{font-size:11px;font-weight:800;color:var(--muted)}.rsb.low{border-color:var(--red);background:#fff1ee}.rsb.low b{color:var(--red)}.rsb[disabled]{opacity:.45}
.mq{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}.mq span{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:14px;background:#eaf6f2;border:2px solid #9fd4b8;border-radius:10px;padding:1px 8px 1px 4px}.mq span.no{background:#fff1ee;border-color:var(--red);color:var(--red)}.mq img.qi{width:9px;height:27px;object-fit:contain}
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud"><b id="hDay">Ngày 1</b><span class="sp"></span><span class="pill" id="hRep">❤️ 0</span><span class="pill" id="hMoney">0đ</span></header>

  <section class="scr" id="route">
    <div class="body" id="routeBody"></div>
  </section>

  <section class="scr" id="market" hidden>
    <div class="body" id="mBody"></div>
    <div class="foot"><button class="btn ghost" id="mAuto">✨ Gợi ý</button><button class="btn wide" id="mGo">Lên đường →</button></div>
  </section>

  <section class="scr" id="menu" hidden>
    <div class="body" id="menuBody"></div>
    <div class="foot"><button class="btn wide" id="toMarket">🛒 Đi chợ →</button></div>
  </section>

  <section class="scr" id="sell" hidden>
    <div class="sceneWrap"><canvas id="sc"></canvas></div>
    <div class="xord" id="xord"></div>
    <div class="xeWrap" id="xeWrap"><canvas id="xe" aria-label="Xe cá viên"></canvas></div>
    <button class="btn evBtn" id="evBtn" hidden>🏃 Dẹp xe!</button>
    <button class="pauseBtn" id="pauseBtn" aria-label="Tạm dừng"><i></i><i></i></button>
    <div class="ov" id="stopOv" hidden><div class="card" id="stopCard"></div></div>
  </section>

  <section class="scr" id="hub" hidden>
    <div class="hubhead"><button class="back" id="hubBack" aria-label="Quay lại">←</button><div id="hubTabs"></div></div>
    <div class="body" id="hubBody"></div>
  </section>

  <section class="scr" id="sum" hidden>
    <div class="body" id="sumBody"></div>
    <div class="foot"><button class="btn wide" id="nextBtn">Ngày mai →</button></div>
  </section>

  <div class="ov" id="edOv" hidden><div class="card ed"><div class="edh"><div id="edHead"></div><button class="x" id="edX" aria-label="Đóng">✕</button></div>
    <div class="pcWrap" id="pcWrap"><canvas id="pc" aria-label="Xiên món: chạm hoặc giữ tô viên, chạm que để gỡ viên cuối"></canvas></div>
    <div class="acts row2"><button class="btn ghost sm" id="edDel">🗑️</button><button class="btn wide" id="edOk">✓</button></div></div></div>
  <div class="ov" id="pauseOv" hidden><div class="card"><div class="big">⏸</div><div class="acts"><button class="btn wide" id="resumeBtn">Tiếp tục</button><button class="btn ghost" id="earlyBtn"></button><button class="btn ghost" id="sndBtn"></button><button class="btn ghost" id="musBtn"></button></div></div></div>
  <div class="ov" id="fightOv" hidden><div class="card" id="fightCard"></div></div>
  <div class="ov" id="pickOv" hidden><div class="card" id="pickCard"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="art.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
