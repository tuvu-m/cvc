<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e2503c">
<title>Cá Viên Chiên Bé Ba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e2503c;--red-d:#b8361e;--mus:#f6c24a;--teal:#2f8f8a;--teal-d:#1f6b67;--cream:#fdf3df;--paper:#fffaf0;--ink:#1f2d4d;--muted:#7d7466;--line:#d8c9b0;--good:#3f8f66;--bad:#d9534f;--f-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-b:"Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2a3558;color:var(--ink);font-family:var(--f-b);overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hud{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px);padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--red);color:#fff;border-bottom:3px solid var(--ink)}
.hud b{font-family:var(--f-d);font-size:20px;line-height:1}.hud .sp{flex:1}
.pill{font-family:var(--f-d);font-weight:800;font-size:15px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}.scr[hidden]{display:none}
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
.foot{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--red);color:#fff;font-family:var(--f-d);font-weight:800;font-size:17px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.btn.wide{flex:1}.btn.ghost{background:var(--paper);color:var(--ink)}.btn.teal{background:var(--teal)}.btn[disabled]{opacity:.45}
.btn.sm{min-height:34px;font-size:14px;padding:0 10px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
h2{font-family:var(--f-d);font-size:22px;margin:2px 2px 10px;line-height:1.1}
/* thẻ lộ trình */
.rcard{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 10px 10px;margin-bottom:12px;box-shadow:0 4px 0 var(--ink)}
.rcard .rh{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-weight:800;font-size:18px;margin:0 2px 4px}.rcard .rh span{flex:1}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:2px 8px;align-items:center;padding:6px 4px;border-top:2px dashed var(--line)}
.stop .tm{font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1}.stop .tm i{display:block;font-style:normal;font-size:20px}
.stop .ln{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;min-width:0}.stop .ln small{font-size:12px;color:var(--red)}
.stop .ln .ev{font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:999px;padding:0 6px}
.stop .lk{grid-column:2;display:flex;align-items:center;gap:3px;min-width:0}.stop .lk img{width:22px;height:22px;object-fit:contain}.stop .lk .hd{width:20px;height:26px;object-fit:cover;object-position:top;border-radius:6px;background:#efe3cc}
.crowd{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.crowd .bars{display:flex;gap:2px;align-items:flex-end;height:22px}.crowd .bars i{display:block;width:6px;border-radius:2px;background:var(--line)}.crowd .bars i.on{background:var(--red)}
/* chợ */
.mtop{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.warn{border-color:var(--red);color:var(--red)}
.mrow{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px}
.mrow.on{border-color:var(--teal);background:#eaf6f2}.mrow img{width:46px;height:46px;object-fit:contain}
.mrow .nm{font-weight:800;font-size:15px;line-height:1.15}.mrow .pr{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--red)}.dn{color:var(--good)}.tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);border-radius:999px;padding:0 6px;vertical-align:2px}
.step{display:flex;align-items:center;gap:4px}.step button{width:36px;height:36px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:20px;line-height:1}
.step b{min-width:22px;text-align:center;font-family:var(--f-d);font-size:19px}
.tog{width:44px;height:36px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:18px}.tog.on{background:var(--teal);color:#fff}
.sec{font-family:var(--f-d);font-weight:800;font-size:16px;margin:12px 2px 6px;color:var(--muted)}
/* bán */
#sell{position:relative}
.sceneWrap{flex:none;position:relative}.sceneWrap canvas{display:block;touch-action:none}
.xord{flex:none;padding:5px 8px 4px;background:var(--paper);border-top:3px solid var(--ink);border-bottom:2px solid var(--line);min-height:54px}
.xh{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.2}.xh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.xh small{font-size:11px;font-weight:700;color:var(--muted);flex:none}
.xp{flex:1;min-width:40px;height:7px;border-radius:99px;background:#eadfd3;overflow:hidden;display:block}.xp>i{display:block;height:100%;width:100%;background:var(--good)}
.xcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.xc{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;padding:1px 8px 1px 3px;border-radius:999px;border:2px solid #ee7a1f;background:#ffe8d2;line-height:1.35;white-space:nowrap}
.xc img{width:18px;height:18px;object-fit:contain}.xc b{font-variant-numeric:tabular-nums}.xc.s{padding-left:7px}.xc.ok{border-color:#9fd4b8;background:#eef8f2;color:#2f6a4c}.xc.wip{border-color:#e0b24a;background:#fff6dc}.xc.bad{border-color:var(--bad);background:#fde3e0;color:var(--bad)}
.xn{font-size:22px;padding:8px 2px;text-align:center}
.xeWrap{flex:1;min-height:0;position:relative;overflow:hidden;background:#f4e6cc}.xeWrap canvas{display:block;touch-action:none}
.pauseBtn{position:absolute;right:8px;top:calc(6px + env(safe-area-inset-top,0px));z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(255,250,240,.92);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:4px}
.pauseBtn i{display:block;width:4px;height:13px;border-radius:2px;background:var(--ink)}
.ov{position:absolute;inset:0;z-index:20;background:rgba(31,45,77,.55);display:flex;align-items:center;justify-content:center;padding:20px}.ov[hidden]{display:none}
.card{width:100%;max-width:340px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--ink);text-align:center}
.card .big{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.15;margin:2px 0 8px}
.card .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:16px;margin:6px 0 12px}
.card .acts{display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:50%;bottom:calc(var(--tb,40%) - 40px);transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:6px 14px;border-radius:14px;font-weight:700;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:.95;transform:translate(-50%,0)}
#app:not(.selling) .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* tổng kết */
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sbox{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px}.sbox small{display:block;font-size:12px;font-weight:700;color:var(--muted)}.sbox b{font-family:var(--f-d);font-size:22px;font-variant-numeric:tabular-nums}
.sbox.net{grid-column:1/3;border-color:var(--ink);border-width:3px}.sbox.net b{font-size:28px}
.mlist{display:flex;flex-wrap:wrap;gap:6px}.mlist span{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px}.mlist img{width:22px;height:22px;object-fit:contain}
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud"><b id="hDay">Ngày 1</b><span class="sp"></span><span class="pill" id="hRep">❤️ 0</span><span class="pill" id="hMoney">0đ</span></header>

  <section class="scr" id="route">
    <div class="body" id="routeBody"></div>
  </section>

  <section class="scr" id="market" hidden>
    <div class="body" id="mBody"></div>
    <div class="foot"><button class="btn ghost" id="mAuto">✨ Gợi ý</button><button class="btn wide" id="mGo">Lên đường →</button></div>
  </section>

  <section class="scr" id="sell" hidden>
    <div class="sceneWrap"><canvas id="sc"></canvas></div>
    <div class="xord" id="xord"></div>
    <div class="xeWrap" id="xeWrap"><canvas id="xe" aria-label="Xe cá viên"></canvas></div>
    <button class="pauseBtn" id="pauseBtn" aria-label="Tạm dừng"><i></i><i></i></button>
    <div class="ov" id="stopOv" hidden><div class="card" id="stopCard"></div></div>
  </section>

  <section class="scr" id="sum" hidden>
    <div class="body" id="sumBody"></div>
    <div class="foot"><button class="btn wide" id="nextBtn">Ngày mai →</button></div>
  </section>

  <div class="ov" id="pauseOv" hidden><div class="card"><div class="big">⏸</div><div class="acts"><button class="btn wide" id="resumeBtn">Tiếp tục</button><button class="btn ghost" id="sndBtn"></button><button class="btn ghost" id="musBtn"></button></div></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
